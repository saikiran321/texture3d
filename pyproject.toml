[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "texture3d"
dynamic = ["version"]
description = "Texture a triangle mesh from posed RGB-D frames: one keyframe per face with seam leveling"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sai Kiran" }]
keywords = ["texturing", "rgbd", "mesh", "texture-mapping", "3d-reconstruction"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "opencv-python>=4.5",
    "trimesh>=4.0",
    "pillow>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
texture3d = "texture3d.cli:main"

[tool.setuptools.dynamic]
version = { attr = "texture3d.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py39"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "PLE"]
ignore = [
    "E501",  # long formulas stay on one line
    "UP006", "UP007", "UP035", "UP045",  # typing.List/Optional stay while 3.9 is supported
    "B905",  # zip(strict=) is 3.10+
]
